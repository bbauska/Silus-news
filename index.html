<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Animated Silus Newspaper</title>
    <link rel="stylesheet" href="./css/styles.css">

  </head>
    
  <body>
  <div class="container">
  <div class="newsletter">
    <section class="name">
      <p>Silus Gaming World Shopper</p>
    </section>

    <section class="info">
      <p>DAILY NEWS</p>
      <p>1.09¢</p>
    </section>

    <section class="title">
      <h1>
        <span>Silus</span>
        <span>Gaming World</span>
      </h1>
    </section>

    <section class="content">
      <article class="left-side">
        <h2>
          <span>YouTube's UnspeakablyLARP</span>
          <span>Minecraft</span>
        </h2>
        <div>
          <p>How about UnspeakablyLarp? Give it a go. Or, go home.</p>
          <p>Minecraft was made for blocks. Like blocks were made for building.</p>
        </div>
      </article>
      <article class="right-side">
        <img src="../images/silus-v-silus.png" alt="Silus photo">
        <p></p>
      </article>
    </section>
  </div>
</div>
    
  </body>
  
</html>
